name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install the daemon packages
        if: runner.os == 'Linux'
        run: python -m pip install numpy
      - name: Install the daemon packages
        if: runner.os == 'Windows'
        run: python -m pip install -r daemon/requirements-windows.txt
      - name: Python tests
        run: python -I -m unittest discover -s tests -p "test_*.py" -v
      - name: Lua tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y lua5.4
          for test in tests/*_test.lua; do lua5.4 "$test" mod/StrayHaptics/Scripts/main.lua; done
      - name: Build unoodle
        working-directory: tools/unoodle
        run: cargo build --release --locked
